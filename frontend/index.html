<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deal Mind</title>
    <!--
      Saqlangan mavzu JS bo'lagi kelguncha ham qo'llansin — yuklanish ekrani
      to'g'ri rangda chiqsin (main.tsx dagi bilan bir xil qoida).
    -->
    <script>
      try {
        var m = localStorage.getItem('sotuvai-mavzu');
        if (m !== 'system') document.documentElement.setAttribute('data-theme', m === 'dark' ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <style>
      /* Ilova yuklanguncha ko'rinadigan ekran (React kelgach almashtiriladi). */
      .ilk-yuklanish {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #e8ecf2;
        color: #1f2633;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      :root[data-theme='dark'] .ilk-yuklanish { background: #23272e; color: #e6e9ef; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .ilk-yuklanish { background: #23272e; color: #e6e9ef; }
      }
      .ilk-brend { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; letter-spacing: -0.035em; }
      .ilk-brend em { font-style: normal; color: #2f6fed; }
      .ilk-belgi {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        color: #fff;
        background: linear-gradient(145deg, #4c87ff 0%, #2a62de 100%);
        box-shadow: 0 8px 20px -6px rgba(47, 111, 237, 0.55);
        animation: ilk-nafas 1.6s ease-in-out infinite;
      }
      .ilk-belgi svg { width: 24px; height: 24px; }
      .ilk-chiziq { position: relative; width: 140px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(47, 111, 237, 0.15); }
      .ilk-chiziq::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: #2f6fed;
        animation: ilk-yur 1.1s ease-in-out infinite;
      }
      @keyframes ilk-nafas { 50% { transform: scale(0.94); } }
      @keyframes ilk-yur { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .ilk-belgi, .ilk-chiziq::after { animation: none; }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Shrift stili sahifa chizilishini TO'XTATMAYDI: avval tizim shrifti bilan
      chiziladi, Google Fonts kelgach almashadi (sekin tarmoqda bo'sh ekran bo'lmasin).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <div class="ilk-yuklanish" role="status" aria-label="Yuklanmoqda">
        <div class="ilk-brend">
          <span class="ilk-belgi" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
              <path d="M20 3v4" />
              <path d="M22 5h-4" />
              <path d="M4 17v2" />
              <path d="M5 18H3" />
            </svg>
          </span>
          <span>Deal <em>Mind</em></span>
        </div>
        <div class="ilk-chiziq"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
