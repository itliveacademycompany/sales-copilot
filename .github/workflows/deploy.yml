# CI/CD: har push'da tekshiruv → Docker obrazlar (GHCR) → serverga deploy.
#
# Deploy bosqichi faqat repo sozlamasida DEPLOY_ENABLED=true bo'lganda
# ishlaydi (Settings → Secrets and variables → Actions → Variables).
# Kerakli secretlar (docs/deploy.md, 6-bo'lim):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY   — serverga SSH
#   GHCR_READ_TOKEN (ixtiyoriy)                 — obrazlar private bo'lsa
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Deploy yarim yo'lda uzilmasin — keyingi push navbat kutadi.
  cancel-in-progress: false

permissions:
  contents: read

env:
  BACKEND_IMAGE: ghcr.io/itliveacademycompany/sales-copilot-backend
  WEB_IMAGE: ghcr.io/itliveacademycompany/sales-copilot-web

jobs:
  check:
    name: Tekshiruv (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend — o'rnatish
        working-directory: backend
        run: npm ci
      - name: Backend — typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Frontend — o'rnatish va build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      # Caddyfile xato bo'lsa web konteyner serverda ishga tushmay, sayt
      # to'xtab qolardi — xato shu yerda ushlanadi, deploy boshlanmaydi.
      - name: Caddyfile — tekshiruv
        run: |
          for addr in ":80" "sotuv.example.uz"; do
            docker run --rm -e SITE_ADDRESS="$addr" -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"               caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done

  images:
    name: Docker obrazlar
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend obrazi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Web obrazi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Serverga deploy
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Compose va zaxira skriptini serverga yuborish
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.yml,deploy/backup.sh
          target: /opt/sotuv
          strip_components: 1
      - name: Yangi obrazlarni ishga tushirish
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_READ_TOKEN,IMAGE_TAG
          script_stop: true
          script: |
            set -e
            cd /opt/sotuv
            chmod +x backup.sh
            if [ -n "$GHCR_READ_TOKEN" ]; then
              echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u itliveacademycompany --password-stdin
            fi
            # Deploy'dan oldin zaxira — migratsiya buzsa, qaytish nuqtasi bor.
            if docker compose ps --status running db | grep -q db; then ./backup.sh; fi
            export IMAGE_TAG
            docker compose pull
            docker compose up -d --remove-orphans
            # Backend sog'ligini kutamiz (migratsiya + ishga tushish).
            for i in $(seq 1 30); do
              if docker compose exec -T backend curl -fsS http://127.0.0.1:3000/readyz >/dev/null 2>&1; then
                echo "Backend tayyor ($IMAGE_TAG)"; docker image prune -f; exit 0
              fi
              sleep 5
            done
            echo "Backend 150 soniyada tayyor bo'lmadi — oxirgi loglar:"
            docker compose logs --tail=80 backend
            exit 1
